services:
  database:
    image: mysql:8.4.11
    container_name: qrvet_database
    ports:
      - "3306:3306"
    networks:
      - qrvet_network
    environment:
      MYSQL_DATABASE: ${DB_NAME:-qrvet}
      MYSQL_USER: ${DB_USER:-qrvet}
      MYSQL_PASSWORD: ${DB_PASSWORD:-teste@123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-teste@123}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.2-alpine
    container_name: qrvet_redis
    ports:
      - "6379:6379"
    networks:
      - qrvet_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: kazicas/qrvet-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qrvet_backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - patient_photos:/opt/app/uploads
    ports:
      - "8080:8080"
    networks:
      - qrvet_network
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/${DB_NAME:-qrvet}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-qrvet}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-teste@123}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-${SPRING_PROFILES:-prod}}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-naorespondaqrvet@gmail.com}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-cdqqktzgbgxvhmab}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${MAIL_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_STARTTLS:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${MAIL_STARTTLS:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${MAIL_SSL:-false}
      QRVET_JWT_SECRET: ${QRVET_JWT_SECRET:-${JWT_SECRET:-V5TXeKrrA6OLy6KcT6uUQ0vWQhCwKuoG0bAayAplmDs=}}
      QRVET_FRONTEND_URL: ${QRVET_FRONTEND_URL:-${FRONTEND_URL:-http://localhost:3000}}
      QRVET_PUBLIC_URL: ${QRVET_PUBLIC_URL:-${QRVET_FRONTEND_URL:-${FRONTEND_URL:-http://localhost:3000}}}
      QRVET_COOKIE_SECURE: ${QRVET_COOKIE_SECURE:-${COOKIE_SECURE:-false}}
      QRVET_BOOTSTRAP_SECRET: ${QRVET_BOOTSTRAP_SECRET:-${BOOTSTRAP_SECRET:-teste@123}}
      QRVET_BOOTSTRAP_ADMIN_ENABLED: ${QRVET_BOOTSTRAP_ADMIN_ENABLED:-${BOOTSTRAP_ADMIN_ENABLED:-true}}
      QRVET_BOOTSTRAP_ADMIN_NAME: ${QRVET_BOOTSTRAP_ADMIN_NAME:-${BOOTSTRAP_ADMIN_NAME:-Administrador QRVet}}
      QRVET_BOOTSTRAP_ADMIN_EMAIL: ${QRVET_BOOTSTRAP_ADMIN_EMAIL:-${BOOTSTRAP_ADMIN_EMAIL:-admin@qrvet.com}}
      QRVET_BOOTSTRAP_ADMIN_PASSWORD: ${QRVET_BOOTSTRAP_ADMIN_PASSWORD:-${BOOTSTRAP_ADMIN_PASSWORD:-teste@123}}
      QRVET_MAIL_FROM: ${QRVET_MAIL_FROM:-${MAIL_FROM:-naoresponda@qrvet.com}}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: kazicas/qrvet-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qrvet_frontend
    ports:
      - "3000:80"
    networks:
      - qrvet_network
    depends_on:
      - backend

networks:
  qrvet_network:

volumes:
    database_data:
    patient_photos:
