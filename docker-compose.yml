services:
  database:
    image: mysql:8.4.11
    container_name: qrvet_database
    ports:
        - "3306:3306"
    networks:
      - qrvet_network
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h localhost -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qrvet_backend
    ports:
      - "8080:8080"
    networks:
      - qrvet_network
    environment:
      TZ: ${TZ}
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      JWT_SECRET: ${JWT_SECRET:-qrvet-development-secret-key-change-before-production-2026}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-QRVet <noreply@qrvet.local>}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-true}
      PRESENCE_ONLINE_SECONDS: ${PRESENCE_ONLINE_SECONDS:-300}
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: qrvet_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - qrvet_network

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: qrvet_frontend
      ports:
        - "3000:80"
      networks:
        - qrvet_network
      depends_on:
        - backend


networks:
  qrvet_network:

volumes:
  database_data:
