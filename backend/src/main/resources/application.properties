spring.application.name=qrvet-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/qrvet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:qrvet}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:qrvet}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.jwt.secret=${JWT_SECRET:qrvet-development-secret-key-change-before-production-2026}
app.jwt.access-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-days=${JWT_REFRESH_DAYS:7}
app.cookie.secure=${COOKIE_SECURE:false}
app.mail.from=${MAIL_FROM:QRVet <noreply@qrvet.local>}
app.seed-demo=${APP_SEED_DEMO:false}

