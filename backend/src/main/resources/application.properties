spring.application.name=backend
spring.profiles.active=dev
server.servlet.context-path=/qrvet/api

qrvet.frontend-url=${FRONTEND_URL:http://localhost:5173}
qrvet.jwt-secret=${JWT_SECRET}
spring.data.redis.port=${REDIS_PORT:6379}
spring.flyway.enabled=true

backend.mail-from=${MAIL_FROM:nao-responda@qrvet}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
